# `docker compose up` and the panel is on http://localhost:4310.
#
# One service, one port, one volume. The pairing token is minted on the first
# run and printed in this container's log -- `docker compose logs panel` if you
# scrolled past it.

services:
  panel:
    build: .
    image: ingot-panel
    ports:
      - '${INGOT_PORT:-4310}:4310'
    volumes:
      # The database, the screenshots and the pairing token. Everything else in
      # the image is rebuildable.
      - ingot-data:/data
    environment:
      # Pin the pairing token here to skip the first-run screen on a fresh
      # volume. Leave it unset and the server mints one.
      INGOT_PAIRING_TOKEN: ${INGOT_PAIRING_TOKEN:-}
      # The assistant. All optional: with no key it shows its setup path and
      # every other panel feature works. Pinning the key here makes it
      # uneditable from the panel, which is the point of pinning it.
      #
      # A Claude subscription does not include API usage -- the API is billed
      # separately from prepaid credit at console.anthropic.com. See the
      # README's setup section.
      INGOT_LLM_API_KEY: ${INGOT_LLM_API_KEY:-}
      INGOT_LLM_MODEL: ${INGOT_LLM_MODEL:-}
      # Which connection the assistant uses: anthropic-api or
      # openai-compatible. Leave it unset and the panel chooses.
      #
      # `claude-cli` is deliberately NOT usable here: it runs the `claude`
      # binary on your machine, and a container cannot. That connection is for
      # the local run (`pnpm dev`) -- see docs/assistant.md.
      INGOT_LLM_CONNECTION: ${INGOT_LLM_CONNECTION:-}
      # Two jobs. The endpoint of the openai-compatible connection, and a
      # hosted proxy for the Anthropic one when assistant traffic should leave
      # through something this organisation operates.
      #
      # For an Ollama running on the host, this container's `localhost` is the
      # container: use http://host.docker.internal:11434/v1 instead.
      INGOT_LLM_BASE_URL: ${INGOT_LLM_BASE_URL:-}
      # How many assistant calls this server will serve per window. The guard is
      # against a copied pairing token becoming a spend loop.
      INGOT_ASSISTANT_RATE_LIMIT: ${INGOT_ASSISTANT_RATE_LIMIT:-}
      INGOT_ASSISTANT_RATE_WINDOW_MS: ${INGOT_ASSISTANT_RATE_WINDOW_MS:-}
    # Reaching an Ollama (or anything else) running on the host. Docker Desktop
    # provides this name already; on Linux it has to be mapped.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  ingot-data:
